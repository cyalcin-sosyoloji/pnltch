name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "sinav-apk.zip"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Extract project
        run: unzip -q sinav-apk.zip -d extracted

      - name: Prepare project
        working-directory: extracted/sinav-apk
        run: |
          npm install
          npx cap add android
          npx cap sync android

      - name: Build APK
        working-directory: extracted/sinav-apk/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sinav-debug-apk
          path: extracted/sinav-apk/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
