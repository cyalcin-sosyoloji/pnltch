name: Build Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - "sinav-apk.zip"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools
            platforms;android-35
            build-tools;35.0.0

      - name: Extract ZIP archive
        run: unzip -q sinav-apk.zip -d extracted

      - name: Install dependencies and prepare Android project
        working-directory: extracted/sinav-apk
        run: |
          npm install
          npx cap add android
          npx cap sync android

      - name: Build debug APK
        working-directory: extracted/sinav-apk/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sinav-debug-apk
          path: extracted/sinav-apk/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
